[package]
name = "datavid"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A data-story video harness on top of fframes: story config, facts and asserts, readability rules, geo/raster helpers, procedural audio and loudness, QA."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
rustfft = "6"
ebur128 = "0.1"
hound = "3"
geographiclib-rs = "0.2"
geo = "0.29"
rand = "0.8"
rand_pcg = "0.3"
rand_distr = "0.4"
rayon = "1"
base64 = "0.22"
num-complex = "0.4"
