# The closing card: short source names in a label/value grid, then the credits verbatim. It is not word-capped (a reference
# card) but it does meet the hold rule: 24 words -> 0.35 x 24 + 1 = 9.4 s. Its texts are generated from [[source]] and
# [[credit]] ("label value" per row), so the rule check reads exactly what is drawn.
[[beat]]
id = "fuentes"
kind = "sources"
start = "T_SRC"
end = "TOTAL"
exempt_words = true
card_size = 52

[[source]]
label = "Satélites"
value = "NASA · Copernicus"
[[source]]
label = "Datos"
value = "Min. Ambiente · EEAOC · INDEC"

[[credit]]
label = "Pipeline de Datos, Generación de Video & Producción final:"
value = "Harness Engineering with AI"
[[credit]]
label = "Director & Revisor:"
value = "Francisco Perez"
