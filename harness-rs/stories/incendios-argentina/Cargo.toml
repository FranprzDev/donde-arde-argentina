[package]
name = "incendios-argentina"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "../../build-support/x264_rpath.rs"
description = "«¿Dónde arde Argentina?» — the first story built with the datavid harness: data prep, facts, score and fframes render, all in Rust."

[dependencies]
datavid = { path = "../../crates/datavid" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
csv = "1"
rayon = "1"
indexmap = "2"
geo = "0.29"
rand = "0.8"
rand_pcg = "0.3"
rand_distr = "0.4"
base64 = "0.22"
fframes = { version = "=1.2.1-rc.30", features = ["cli"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.1-rc.30", features = ["cli", "h264", "libav-agree-gpl"] }

[[bin]]
name = "incendios"
path = "src/main.rs"
