# SpookMC ad #4 written the "texts in" way: one [[beat]] per idea with its text and its clip(s); cut times, caption
# timing, push-ins and overlay slots are derived. Same story as promo.toml (22.5 s), in a quarter of the lines.
# Burned-in captions are off; the texts still drive the timing and become out/spookmc_ad4_brief.srt.
#
#   PROMO_CLIPS=/path/to/raw PROMO_MOTION=/path/to/motion promo build examples/spookmc-ad4/brief.toml --preview

[video]
name = "spookmc_ad4_brief"
aspect = "9:16"

[paths]
clips = "${PROMO_CLIPS:-media/raw}"
motion = "${PROMO_MOTION:-media/motion}"

# clips: "file stem" or "stem@in-point"; a clip table can also set dur, zoom = [start, end], blur, focus
[[beat]]
text = "¿Y SI | MINECRAFT | TUVIERA | NUEVAS | DIMENSIONES?"
dur = 2.8
clip = "2026-09-03T00_19_33@0.3"
overlay = { asset = "dimension_cielo", delay = 0.25, crop = [392, 74, 1125, 188], x = 90, y = 250, w = 900 }

[[beat]]
text = "EN SPOOKMC | YA ES POSIBLE"
dur = 1.5
flash = true
clip = { clip = "2026-08-13T15_47_40", in = 7.1, zoom = [1.06, 1.16] }

[[beat]]
text = "VIAJA | A OTRAS | DIMENSIONES"
dur = 2.1
clips = [{ clip = "2026-09-03T00_14_52", in = 0.8, dur = 1.1 }, "2026-09-03T00_15_40@1.0"]
overlay = { asset = "encontraste", crop = "auto", y = 210, w = 700 }

[[beat]]
text = "ENCUENTRA | MOBS | COMPLETAMENTE | NUEVOS"
dur = 2.0
clip = "2026-09-03T00_16_44@0.5"
overlay = { asset = "espadazombie", delay = 0.1, dur = 1.85, crop = [672, 54, 909, 908], x = 610, y = 170, w = 420, sfx = 0.7 }

[[beat]]
text = "LUCHA | CONTRA | BOSSES | MUCHO MÁS | PODEROSOS"
dur = 2.8
flash = true
cue = "braam"
clips = [{ clip = "2026-10-03_18-28-10", in = 5.0, dur = 1.3 }, { clip = "2026-10-03_18-28-10", in = 7.3, zoom = [1.05, 1.15] }]
overlay = { asset = "flecha_glowing", delay = 1.35, crop = [317, 42, 696, 559], x = 120, y = 330, w = 300, sfx = 0.6 }

[[beat]]
text = "CONSIGUE | EQUIPAMIENTO | NUEVO"
dur = 1.7
clip = "2026-09-18T12_05_31@3.1"

[[beat]]
text = "RECORRE | LA TIERRA | A ESCALA | REAL"
dur = 2.5
flash = true
clips = [{ clip = "2026-08-14T22_47_18", in = 0.5, dur = 1.2 }, "2026-08-20T11_54_49@1.0"]
overlay = { asset = "map_travel", crop = [253, 97, 1431, 983], x = 140, y = 190, w = 800, sfx = 0.7 }

[[beat]]
text = "SIN INSTALAR | ABSOLUTAMENTE | NADA"
dur = 2.2
clip = "2026-09-14T15_50_07@0.3"
overlay = { asset = "nomods", crop = [712, 222, 497, 501], x = 380, y = 300, w = 320 }

# the closing card: sharp for `sharp` s, then the clip blurs behind the asset (full frame by default)
[end_card]
clip = "2026-08-25T08_48_26@3.0"
asset = "ip"
dur = 4.9
y = -60
text = "TODO ESTO | EN"

