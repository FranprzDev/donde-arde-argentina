# SpookMC vertical ad #4: the reference example of the promo template, explicit form (every time by hand).
# It reproduces the approved 720p draft (22.5 s): 13 gameplay shots with push-ins, 7 alpha motion graphics with their
# own sound effects, white flashes on the 4 section cuts, a procedural 128 BPM bed with a braam on the boss, −14 LUFS.
# Burned-in captions are OFF (subtitles are added downstream from out/spookmc_ad4.srt); `--captions on` burns them in.
# Every on-screen claim is reused from the three finished SpookMC ads (Finalizados/Spook_1..3).
#
# Media is not in git. Point the paths at your copies (or pass --clips / --motion):
#   PROMO_CLIPS=/path/to/raw PROMO_MOTION=/path/to/motion promo build examples/spookmc-ad4/promo.toml
# Times are output seconds (30 fps). Positions are design pixels on the 1080x1920 canvas (drafts render at 720x1280).

[video]
name = "spookmc_ad4"
aspect = "9:16"
flashes = [2.8, 8.4, 12.9, 17.6]

[paths]
clips = "${PROMO_CLIPS:-media/raw}"
motion = "${PROMO_MOTION:-media/motion}"
out = "out"

[music]
kind = "procedural"
bpm = 128
# drop (groove in) defaults to the first flash (2.8 s), outro to the last flash (17.6 s)

[[cue]]                         # low brass hit on the boss fight
t = 8.4
kind = "braam"
gain = 0.22

