[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-video-harness"
version = "0.1.0"
description = "story.yaml + open data -> short, readable, verifiable data-story videos (code-drawn, no AI imagery)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10.1", "opencv-python-headless>=4.8", "shapely>=2.0", "pyyaml>=6.0", "pandas>=2.1", "pyproj>=3.6"]

[project.optional-dependencies]
data = ["rasterio>=1.3", "requests>=2.31", "paramiko>=3.3", "pyshp>=2.3"]
dev = ["pytest>=7.4"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["assets/*.geojson", "assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
