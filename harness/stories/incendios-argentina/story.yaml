# PRIVATE — port of v9 to the generic harness. Do not publish (contest entry under pseudonym).
title: "¿Dónde arde Argentina?"
slug: incendios-argentina
locale: es

video: {width: 1920, height: 1080, fps: 30, preview_fps: 15, max_duration: 60, crf: 20}

rules:
  min_font_px: 48
  max_words_per_beat: 15        # v9 said "~12"; intro (flat line + spark line overlap: 14) and the ranking (header + 5 names: 12) need more
  sec_per_word: 0.35
  base_hold: 1.0
  min_hold: 2.5

map:
  regions: {path: data/provincias_indec.geojson, id: code, name: name}
  neighbours: data/vecinos.geojson
  shapes: {cane_zone: data/tuc_cane_zone.json}
  ref_lat: -38
  ref_zoom: 30
  home_camera: {center: [-64.2, -38.6], zoom: 26.5, anchor: [1290, 560]}

data:
  hotspots:
    kind: points
    path: data/raw/points.npz
    region: {column: prov, codes: sorted}
    legend: "1 punto = 1 foco de calor (satélite)"
  scar: {kind: raster, path: data/raw/scar_all.npz, grid: data/scar_grid.json, legend: "gris = área quemada"}
  scar_er: {kind: raster, path: data/raw/scar_er_2020.npz, grid: data/scar_grid.json}
  scar_p25: {kind: raster, path: data/raw/scar_pat_2025.npz, grid: data/scar_grid.json}
  scar_p26: {kind: raster, path: data/raw/scar_pat_2026.npz, grid: data/scar_grid.json}
  s2_tuc: {kind: image, path: data/s2/tuc_2025-09-23.jpg}
  s2_delta: {kind: image, path: data/s2/delta_2020-09-23.jpg}
  s2_c24: {kind: image, path: data/s2/comarca_2024.jpg}
  s2_c25: {kind: image, path: data/s2/comarca_2025.jpg}
  s2_c26: {kind: image, path: data/s2/comarca_2026.jpg}
  day_tuc: {kind: points, path: data/s2_day_tuc.csv}
  day_er: {kind: points, path: data/s2_day_er.csv}

facts:
  script: facts.py
  asserts:
    - "hum_10 == 9"
    - "(uniq_ha / 1e6) >= 26.55 and (uniq_ha / 1e6) < 26.65"
    - "round(top5_share * 100) == 53"
    - "[r['name'] for r in ranking[:5]] == ['Formosa', 'La Pampa', 'Santa Fe', 'Corrientes', 'Santiago del Estero']"
    - "tuc_pct == 89"
    - "er_2020 == 37506 and er_2020_points == er_2020"
    - "6.5 < er_ratio < 7.0 and round(er_ratio) == 7"
    - "(pa25, pa26) == (6000, 42000) and pa_x == 7 and pa_ratio >= 7"
  literals:
    "1 DE CADA 10": "0.09 < share_country < 0.10"
    "· 2020": "er_2020 == 37506"
    "· 2026": "pa26 == 42000"
    "EN 2025": "pa25 == 6000"
    "DE CADA 10,": "hum_10 == 9"
    "Sentinel-2": "True"

music: {seed: 23, root: 38, bpm: 100}
audio: {lufs: -14, true_peak: -1.5}

beats:
  - id: intro
    type: globe_intro
    target: all
    speed: 1.25
    title: ["¿DÓNDE ARDE", "ARGENTINA?"]
    flat_text: "EL SOL CALIENTA."
    spark:
      at: {first_point: hotspots}
      lines:
        - {text: "LA CHISPA ES HUMANA.", size: 116, color: accent}
        - {text: "{hum_10} DE CADA 10, CON CAUSA CONOCIDA", size: 66, color: text}

  - id: catorce-anos
    type: timeline
    data: hotspots
    range: [0, 168]
    warp: [[0, 12, 0.036], [12, 156, 0.0215], [156, 168, 0.03]]
    label: {origin: 2012, per: 12, final: "{y0}–{y1}"}
    ticks: {every: 12, label_every: 48, origin: 2012}
    camera: {center: [-64.2, -38.6], zoom: 30, anchor: [1290, 548]}
    transition: {mode: ease, dur: 3.894}
    shake: 7

  - id: area
    type: big_number
    camera: {center: [-64.0, -38.4], zoom: 31.5, anchor: [1290, 548]}
    transition: {mode: ease, dur: 0.4}
    text_delay: 0.9
    number: "{uniq_ha|div:1e6|dec:1} MILLONES"
    unit: "DE HA"
    subline: "QUEMADAS: CASI 1 DE CADA 10 DEL PAÍS"
    number_color: text
    subline_color: accent
    glow: 0.4
    shake: 5
    layers:
      - {id: hotspots, mode: burnout}
      - {id: scar, appear: 1.0, fade_in: 0.9}

  - id: ranking
    type: ranking
    rows: ranking
    top: 5
    header: "{top_n} PROVINCIAS = {top5_share|pct} %"
    camera: {center: [-64.2, -38.6], zoom: 30, anchor: [1430, 548]}
    transition: {mode: ease, dur: 0.7}
    label_points: {"06": [-60.3, -36.9]}
    layers: [{id: scar, strength: 0.25}]

  - id: tucuman
    type: big_number
    camera: {center: [-65.25, -27.05], zoom: 230, anchor: [1440, 560]}
    transition: {mode: zoomto, dur: 1.0}
    flags: [assets/flags/tucuman.png]
    head: "TUCUMÁN"
    number: "{tuc_pct} %"
    unit: "DE SUS FOCOS"
    subline: "EN ZONA CAÑERA, EN PLENA ZAFRA"
    highlight: [{regions: ["90"], color: accent2}, {shape: cane_zone, color: hot, width: 4, from: 1.0, glow: false}]
    spotlight: {regions: ["90"], dim: 0.25}
    replay: {data: hotspots, select: "(region == '90') & ((t % 12) >= 4) & ((t % 12) < 11)", time: "((t % 12) - 4) / 7.0 * 0.85", over: 2.4, gain: 0.5, activity_scale: 3}
    outline_all: dim
    layers: [{id: scar, strength: 0.5, recede_zoom: 900}]

  - id: burruyacu
    type: satellite_zoom
    image: s2_tuc
    labels: ["BURRUYACÚ, TUCUMÁN", "{tuc_s2_date} · Sentinel-2"]
    points: day_tuc
    announce: 3.85
    outline_all: dim
    layers: [{id: scar, strength: 0.5, recede_zoom: 900}]

  - id: entre-rios
    type: big_number
    camera: {center: [-59.85, -32.75], zoom: 150, anchor: [1380, 560]}
    transition: {mode: fly, dur: 1.0}
    flags: [assets/flags/entre_rios.png]
    head: "ENTRE RÍOS · 2020"
    number: "{er_2020|int}"
    count_to: "{er_2020}"
    unit: "FOCOS"
    subline: "CASI {er_ratio|round} VECES LO HABITUAL"
    highlight: [{regions: ["30"], color: accent2}]
    spotlight: {regions: ["30"], dim: 0.25}
    replay: {data: hotspots, select: "(region == '30') & (t >= 96) & (t < 108)", over: 2.6, gain: 0.6, activity_scale: 0.15}
    outline_all: dim
    layers: [{id: scar, strength: 0.5, recede_zoom: 900}, {id: scar_er, style: event, color: "#FF8C32", appear: 0.0}]

  - id: delta
    type: satellite_zoom
    image: s2_delta
    labels: ["ISLAS DEL DELTA", "{er_s2_date} · Sentinel-2"]
    pins: [{lon: -60.68, lat: -32.95, label: "ROSARIO"}]
    points: day_er
    announce: 3.5
    outline_all: dim
    layers: [{id: scar, strength: 0.5, recede_zoom: 900}]

  - id: comarca
    type: before_after
    camera: {center: [-71.43, -42.18], zoom: 760, anchor: [1400, 560]}
    transition: {mode: fly, dur: 1.1}
    images: [s2_c24, s2_c25, s2_c26]
    labels: ["DIC 2024", "ABR 2025", "ABR 2026"]
    wipes: [0.7, 1.85]
    overlays: [{data: scar_p25, color: accent2, at: 1.15, label: "■ 2025"}, {data: scar_p26, color: red, at: 2.3, label: "■ 2026"}]
    flags: [assets/flags/chubut.png, assets/flags/rio_negro.png]
    head: "COMARCA ANDINA · 2026"
    number: "{pa26|int}"
    count_to: "{pa26}"
    unit: "HA"
    subline: "{pa_x} VECES MÁS QUE EN 2025"
    replay: {data: hotspots, select: "((region == '26') | (region == '62')) & (lon < -70.9) & (t >= 156) & (t < 159)", over: 2.0, gain: 9, blur: 2.2, activity_scale: 60}
    outline_all: dim
    shake: 5
    layers: [{id: scar, strength: 0.5}]

  - id: cierre
    type: closing
    camera: {center: [-64.2, -38.6], zoom: 28, anchor: [1500, 548]}
    transition: {mode: zoomto, dur: 0.7}
    lines: [{text: "YA NO FALTAN DATOS."}, {text: "FALTA RESPONSABILIDAD.", color: accent, delay: 0.25}]
    size: 124
    layers: [{id: scar}, {id: hotspots, mode: accumulate}]

  - id: fuentes
    type: sources
    duration: 3.0
    layers: [{id: scar}, {id: hotspots, mode: lit, strength: 0.65}]
    outline_all: glow
    lines:
      - "Focos: NASA FIRMS, VIIRS 375 m, 2012–2025 (1 foco ≠ 1 incendio)."
      - "Área quemada: NASA MODIS MCD64A1, 500 m; cada píxel cuenta 1 vez."
      - "Causas: Min. de Ambiente, 1993–2019. Caña: EEAOC. Límites: INDEC."
      - "«Lo habitual»: mediana de los otros 13 años. Comarca: ene–mar."
      - "Imágenes: datos Copernicus Sentinel-2 modificados (2020–2026)."
      - "Banderas: Wikimedia Commons (DP; CC BY 4.0: Chubut, R. V. Jones /"
      - "Gob. del Chubut; Río Negro, D. Cuomo y Hellerick)."
      - "Sol, Tierra, mapas, animación y música: hechos con código."
