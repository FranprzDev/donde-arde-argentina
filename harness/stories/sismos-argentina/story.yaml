# Toy example: renders in ~1-2 minutes, no network. Every number comes from facts.py (bundled open data).
title: "Sismos en la Argentina, 2015–2024"
slug: sismos-argentina
locale: es

video:
  width: 960            # small on purpose (fast); the design grid is always 1920x1080, so 1920x1080 also works
  height: 540
  fps: 15
  preview_fps: 10
  max_duration: 40

rules:                   # defaults shown; the build fails if any is broken
  min_font_px: 48
  max_words_per_beat: 12
  sec_per_word: 0.35
  base_hold: 1.0
  min_hold: 2.5

theme:
  palette: {accent: "#FF6E1E", accent2: "#FFB03C", hot: "#FFE2A0"}

map:
  regions: {path: data/provincias_ign.geojson, id: code, name: name}
  neighbours: data/contexto_tierra.geojson
  ref_lat: -38
  home_camera: {center: [-64.2, -38.6], zoom: 26.5, anchor: [1290, 560]}

data:
  sismos:
    kind: points
    path: data/sismos_usgs_2015_2024.csv
    lon: longitude
    lat: latitude
    time: {column: time, unit: month, origin: "2015-01-01"}
    region: assign                  # point-in-polygon against map.regions
    columns: [mag, depth_km]
    point_px: 5                     # dot radius (design px): sparse data needs bigger dots
    legend: "1 punto = 1 sismo (M 4,5 o más)"

facts:
  script: facts.py
  asserts:
    - "total == 869"                       # pin the dataset: if the CSV changes, the text must be re-checked
    - "min_mag >= 4.5"
    - "[r['name'] for r in ranking[:3]] == ['Salta', 'Jujuy', 'San Juan']"
    - "round(top_share * 100) == 73"
    - "0.30 <= first_share < 0.31"
    - "noa_share > 0.5"
  literals:
    "4,5": "min_mag >= 4.5"
    "3 DE CADA 10": "0.295 <= first_share < 0.315"

music: {seed: 7, root: 40, bpm: 96}

beats:
  - id: intro
    type: globe_intro
    target: all
    speed: 1.0
    title: ["SISMOS EN LA", "ARGENTINA"]
    title_size: 132

  - id: diez-anos
    type: timeline
    data: sismos
    range: [0, 120]
    warp: [[0, 120, 0.034]]
    label: {origin: 2015, per: 12, final: "{year_first}–{year_last}"}
    ticks: {every: 12, label_every: 36, origin: 2015}
    transition: {mode: ease, dur: 4.0}
    camera: {center: [-64.6, -36.0], zoom: 30, anchor: [1290, 560]}
    glow_tau: 0.5

  - id: total
    type: big_number
    camera: previous
    number: "{total|int}"
    unit: "SISMOS"
    subline: "DE MAGNITUD 4,5 O MÁS"
    number_color: text
    subline_color: accent
    layers: [{id: sismos, mode: lit, norm: 6}]

  - id: ranking
    type: ranking
    rows: ranking
    top: 3
    label_points: {"38": [-65.9, -22.9], "66": [-64.3, -25.2]}
    header: "{top_n} PROVINCIAS = {top_share|pct} %"
    transition: {mode: ease, dur: 0.5}
    camera: {center: [-64.2, -38.6], zoom: 30, anchor: [1430, 548]}
    layers: [{id: sismos, mode: static}]

  - id: primera
    type: big_number
    camera: {fit: ["66"], size: [620, 700], anchor: [1420, 540]}
    transition: {mode: zoomto, dur: 1.0}
    head: "{first_name}"
    number: "{first_n|int}"
    unit: "SISMOS"
    subline: "3 DE CADA 10 DEL PAÍS"
    highlight: [{regions: ["66"], color: accent2}]
    spotlight: {regions: ["66"], dim: 0.35}
    replay: {data: sismos, select: "region == '66'", over: 2.0, gain: 3.0, blur: 1.5}
    layers: [{id: sismos, mode: static}]

  - id: cierre
    type: closing
    camera: {center: [-64.2, -38.6], zoom: 28, anchor: [1500, 548]}
    transition: {mode: zoomto, dur: 0.8}
    lines:
      - {text: "MÁS DE LA MITAD,"}
      - {text: "EN EL NOROESTE.", color: accent}
    size: 110
    layers: [{id: sismos, mode: accumulate, norm: 6}]

  - id: fuentes
    type: sources
    lines:
      - "Sismos: USGS ANSS ComCat, M ≥ 4,5, 2015–2024 (dominio público)."
      - "Solo epicentros dentro de la Argentina."
      - "Límites: IGN, vía Georef (datos.gob.ar, CC BY 4.0)."
      - "Tierra de contexto: Natural Earth (dominio público)."
      - "Mapas, animación y música: hechos con código."
    duration: 3.0
